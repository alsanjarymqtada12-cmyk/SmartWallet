name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: pip install flet==0.23.2 requests
      - name: Build APK
        run: |
         rm -rf ~/.gradle/caches/
         yes | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartWallet-APK
          path: build/apk/**/*.apk
